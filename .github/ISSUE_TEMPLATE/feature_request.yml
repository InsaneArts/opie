name: Feature request
description: Something Opie should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If you are not yet sure what you want, [Discussions › Ideas](https://github.com/InsaneArts/opie/discussions) is the better place to think it through.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the feature. What do you do on your Mac today to get it done?
      placeholder: |
        I switch my audio output between AirPods and the speakers many times a day, and each switch is four clicks.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What Opie could do instead
      description: The Slice you would add, and what should happen when you let go on it.
      placeholder: |
        A Slice that opens a fan of my audio outputs, and letting go on one switches to it.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Opie
      options:
        - The Ring itself (holding, aiming, letting go, scrolling)
        - A new Action
        - Rings and Slices (Custom, App, or Dedicated)
        - Settings
        - Something Opie does not do at all
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Another app, a shortcut, a script, and what is wrong with it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and discussions and this is not one of them.
          required: true
